# ====================================================================
# 1. CORE PORTABILITY & WINDOWS COMPATIBILITY SETTINGS
# ====================================================================
# Safe, highly-compatible 256 color profile for Windows SSH clients
set -g default-terminal "screen-256color"

# Safe true-color override that doesn't bleed garbage characters on Windows
set -ga terminal-overrides ",*256col*:Tc"

# DISABLERS: Stop Windows/Oh My Posh from dumping background hex strings (^[]11;rgb...)
set -ag terminal-overrides ",*:XT@"

# Enable mouse mode for resizing and clicking panes
set-option -g mouse on

# Better mouse scrolling (Scrolls pane under mouse, switches to copy mode automatically)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# ====================================================================
# 2. SSH & REMOTE LIFE QUALITY UPGRADES
# ====================================================================
# Boost history limit (Default is only 2000; saves massive build logs from truncating)
set -g history-limit 50000

# Prevent tmux from delaying the Escape key (Crucial for responsive Vim usage over SSH)
set -s escape-time 0

# Increase tmux messages display duration to 3 seconds
set -g display-time 3000

# Refresh status line more frequently (Default is 15s)
set -g status-interval 5

# Easy config reload shortcut
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ====================================================================
# 3. PANES, WINDOWS & NAVIGATION
# ====================================================================
# Make new panes/windows inherit current pane working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Bulletproof Vim-style PANE switching (Prefix + h/j/k/l)
# Avoids Windows Terminal intercepting the Alt key for pane movements
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# --------------------------------------------------------------------
# NEW: Browser-Tab Style WINDOW Navigation (No Prefix Needed)
# --------------------------------------------------------------------
# Style A: Ctrl+Tab to go to next window, Ctrl+Shift+Tab to go to previous
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Style B: Alt+Left / Alt+Right to cycle through windows seamlessly
bind -n M-Left previous-window
bind -n M-Right next-window

# Style C: Alt+h / Alt+l directional alternative (if arrows are blocked by client)
bind -n M-h previous-window
bind -n M-l next-window
# --------------------------------------------------------------------

# Use Vim-style keys in copy mode (Visual select with 'v', copy with 'y')
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ====================================================================
# 4. VISUALS: THE "WHERE AM I?" STATUS BAR
# ====================================================================
# Clean visual style that highlights the active window and hostname
set -g status-style bg=black,fg=white
set -g window-status-current-style bg=blue,fg=black,bold

# Left side shows the session name
set -g status-left "#[fg=green][#S] "
set -g status-left-length 20

# Right side shows: Hostname (Crucial so you know what server you are on) | Date | Time
set -g status-right "#[fg=cyan]#H #[fg=white]| #[fg=yellow]%Y-%m-%d #[fg=white]| #[fg=white]%H:%M "
set -g status-right-length 60
